[package]
name = "pygame-rs-dev"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "pygame-rs-dev —— pygame 的 python（开发解释器）：pygame 全内置、零 Rust 工具链"

[lib]
# 库 = 宿主运行时（host trait / runtime / platform 各实现）——桌面 bin 与
# Android 调试壳 example 共用
name = "pygame_rs_dev"
path = "src/lib.rs"

[[bin]]
# 产物名 = python（用户定夺：开发解释器的分发形态就是 python.exe——
# pygame 全内置的 python 发行版；项目/仓库名 = pygame-rs-dev）
name = "python"
path = "src/main.rs"

[[example]]
# Android 调试壳（cdylib）：dialog 选文件运行（单文件 -c 形态）
name = "android_host"
path = "examples/android_host.rs"
crate-type = ["cdylib"]

[dependencies]
# 核心库（绑定面 + 宿主）：pygame 全内置
pygame-rs = { path = "../pygame-rs", features = ["gui", "physics2d", "physics3d"] }
# 事件泵/混音器驱动（脚本直跑的游戏门帧循环用）
starfish-pygame = { path = "../starfish/crates/starfish-pygame" }
# 开发辅助（app_entry! 跨平台入口宏；we = Android android_main 装配）
starfish-std = { path = "../starfish/crates/starfish-std", features = ["we"] }

# RustPython 三件套（path 指向 pygame-rs 的 vendored——与 pygame-rs
# 同源同版本合并单实例；features 必须与 pygame-rs 完全一致）
rustpython-vm = { path = "../pygame-rs/src/rpy/dependencies/RustPython-main/crates/vm", default-features = false, features = [
    "compiler", "wasmbind", "gc", "stdio", "importlib", "encodings", "freeze-stdlib",
] }
rustpython-pylib = { path = "../pygame-rs/src/rpy/dependencies/RustPython-main/crates/pylib", features = ["freeze-stdlib"] }
rustpython-derive = { path = "../pygame-rs/src/rpy/dependencies/RustPython-main/crates/derive" }

# ── Web 宿主（platform/web.rs；版本与 Cargo.lock 严格一致——
# wasm-bindgen-cli 校验同规）──
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["Window", "Location"] }
starfish-io = { path = "../starfish/crates/starfish-io" }

# ── 移动宿主（platform/mobile.rs 的 dialog 载荷通道；robius-file-picker
#     实现，Android 构建前置 ANDROID_JAR 环境变量）──
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
starfish-dialog = { path = "../starfish/crates/starfish-dialog" }

# ── Android 宿主（嵌入模式 JNI 面 + android_host 独立运行入口）──
[target.'cfg(target_os = "android")'.dependencies]
starfish-we = { path = "../starfish/crates/starfish-we", features = ["embedded"] }
starfish-io = { path = "../starfish/crates/starfish-io" }
jni-sys = "0.3"
android-activity = "0.6"
# 嵌入形态由宿主经 JNI 导出注入（nativeInitContext）——cpal/robius 等
# JNI 消费方读同一静态；无 glue 时无人初始化，脚本一碰音频即 panic
#（真机实证）；版本须与依赖树现存严格一致（单实例归一）
ndk-context = "0.1.1"

[profile.release]
strip = true
